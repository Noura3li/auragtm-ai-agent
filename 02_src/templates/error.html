<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraGTM — {{ code }}</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
:root { --navy:#1a3057; --navy-dark:#0f1e38; --blue:#2e6db4; --text-mid:#2d4a6b; --border:#c4d8ec; }
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(165deg, #f1f7fd 0%, #dde9f8 52%, #cadcf2 100%);
  background-attachment: fixed; color: var(--navy-dark); text-align:center; padding:24px;
}
.box { max-width:460px; }
img { height:70px; margin-bottom:22px; }
.code { font-size:54px; font-weight:800; color:var(--navy); line-height:1; }
h1 { font-size:19px; font-weight:700; margin:10px 0 10px; color:var(--navy-dark); }
p { font-size:14px; color:var(--text-mid); line-height:1.6; margin-bottom:24px; }
a.btn { display:inline-block; padding:12px 26px; border-radius:11px; background:linear-gradient(135deg,#1a3057,#2e6db4); color:#fff; text-decoration:none; font-weight:700; font-size:14px; box-shadow:0 4px 16px rgba(26,48,87,0.3); }
</style>
</head>
<body>
  <div class="box">
    <img src="/static/logo.png" alt="AuraGTM" onerror="this.style.display='none';">
    <div class="code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
